              - {id: pde.schrodinger-equation, title: The Schrodinger equation, kind: application, scope: "Time-dependent and time-independent forms, separation into stationary states, the free particle, infinite well and harmonic oscillator, normalization and probability current.", prereqs: [pde.separation-of-variables, spec.hermite-polynomials], keywords: [schrodinger equation, stationary state, wave function]}
              - {id: pde.klein-gordon-equation, title: The Klein-Gordon equation, kind: application, scope: "Relativistic wave equation, dispersion relation, plane-wave solutions, comparison with the wave and Schrodinger equations, the massless limit.", prereqs: [pde.dalembert, pde.helmholtz-equation], keywords: [klein-gordon equation, dispersion relation, relativistic]}
      - id: modern-pde
