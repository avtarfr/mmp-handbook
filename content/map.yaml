              - {id: pde.lax-milgram, title: The Lax-Milgram theorem and the Dirichlet problem, kind: theorem, level: advanced, scope: "Lax-Milgram, existence and uniqueness of weak solutions of elliptic problems, Poincare inequality.", prereqs: [pde.weak-solutions-sobolev, funcan.riesz-representation], keywords: [lax-milgram, poincare inequality, coercive]}
              - {id: pde.energy-estimates, title: Energy estimates and well-posedness, kind: theorem, level: advanced, scope: "Energy estimates for parabolic and hyperbolic problems and the well-posedness they give.", prereqs: [pde.wave-energy, pde.heat-maximum-principle], keywords: [energy estimates, well-posed]}
              - {id: pde.operator-semigroups, title: Evolution equations and operator semigroups, kind: theorem, level: advanced, scope: "Strongly continuous semigroups, generators, the Hille-Yosida theorem (statement), the heat semigroup as the example.", prereqs: [funcan.unbounded-operators, pde.heat-kernel], keywords: [semigroup, generator, hille-yosida]}
              - {id: pde.radon-transform, title: The Radon transform, kind: method, level: advanced, scope: "Integrals over hyperplanes, the projection-slice theorem, filtered back-projection, use in tomography and in solving the wave equation.", prereqs: [fourier.fourier-transform-rn], keywords: [radon transform, projection-slice, back-projection]}

  - id: green
    title: Green's functions and integral equations
    chapters:
      - id: green-ode
        title: Green's functions for ordinary differential equations
        summary: Construction and properties of Green's functions for boundary-value and initial-value problems.
        sections:
          - id: green-ode
            title: Green's functions in one dimension
            units:
              - {id: green.green-function-bvp, title: Green's function for a boundary-value problem, kind: theorem, scope: "Construction for second-order BVPs, jump conditions, representation of the solution, symmetry for self-adjoint problems.", prereqs: [ode.self-adjoint-operators, vcalc.dirac-delta-basics], keywords: [green's function, jump condition, boundary value problem]}
              - {id: green.fredholm-alternative, title: The Fredholm alternative and modified Green's functions, kind: theorem, scope: "Solvability conditions when the homogeneous problem has solutions, modified Green's functions.", prereqs: [green.green-function-bvp], keywords: [fredholm alternative, modified green's function, solvability condition]}
              - {id: green.eigenfunction-expansion-green, title: Eigenfunction expansion of Green's functions, kind: theorem, scope: "Bilinear expansion in eigenfunctions, resolvent, poles at eigenvalues.", prereqs: [green.green-function-bvp, ode.eigenfunction-expansions], keywords: [eigenfunction expansion, bilinear, green's function]}
              - {id: green.causal-green-functions, title: Causal Green's functions for initial-value problems, kind: method, scope: "Retarded Green's functions, the damped oscillator, response functions and causality.", prereqs: [green.green-function-bvp, fourier.convolution-theorem], keywords: [causal, retarded, impulse response]}
      - id: green-pde
        title: Green's functions for partial differential equations
        summary: Green's functions for the Laplace, Helmholtz, wave and heat equations.
        sections:
          - id: green-pde
            title: Green's functions in several dimensions
            units:
              - {id: green.laplace-green-functions, title: Green's functions for Laplace and Poisson problems, kind: theorem, scope: "Dirichlet and Neumann Green's functions, representation formula, symmetry.", prereqs: [pde.laplace-fundamental-solution], keywords: [green's function, dirichlet problem, poisson's equation]}
              - {id: green.method-of-images, title: The method of images, kind: method, scope: "Green's functions for a half-space and a sphere by images; image charges.", prereqs: [green.laplace-green-functions], keywords: [method of images, image charge]}
              - {id: green.helmholtz-green-functions, title: Green's functions for the Helmholtz equation, kind: method, scope: "Outgoing Green's functions in one, two and three dimensions by contour integration.", prereqs: [pde.helmholtz-equation, complex.infinite-integrals], keywords: [helmholtz equation, outgoing, green's function]}
              - {id: green.wave-heat-green-functions, title: Green's functions for the wave and heat equations, kind: method, scope: "Retarded Green's function of the wave equation, heat kernel as a Green's function, Duhamel's principle.", prereqs: [green.helmholtz-green-functions, pde.heat-kernel], keywords: [retarded green's function, wave equation, heat equation]}
              - {id: green.born-approximation, title: Scattering and the Born approximation, kind: application, level: advanced, scope: "Lippmann-Schwinger equation, Born series, scattering amplitude.", prereqs: [green.helmholtz-green-functions, green.neumann-series], keywords: [born approximation, scattering, lippmann-schwinger]}
      - id: integral-equations
        title: Integral equations
        summary: Fredholm and Volterra equations and their solution.
        sections:
          - id: integral-equations
            title: Linear integral equations
            units:
              - {id: green.integral-equations, title: Classification of integral equations, kind: definition, scope: "Fredholm and Volterra equations of the first and second kinds, kernels, conversion from ODEs.", prereqs: [], keywords: [integral equation, fredholm, volterra]}
              - {id: green.neumann-series, title: Neumann series, kind: theorem, scope: "Iterative solution of second-kind equations, convergence for small kernels, resolvent kernel.", prereqs: [green.integral-equations, funcan.banach-fixed-point], keywords: [neumann series, resolvent kernel, iteration]}
              - {id: green.separable-kernels, title: Separable kernels, kind: method, scope: "Reduction of equations with degenerate kernels to linear algebra, the Fredholm alternative.", prereqs: [green.integral-equations, linalg.linear-systems], keywords: [separable kernel, degenerate kernel]}
              - {id: green.hilbert-schmidt, title: Hilbert-Schmidt theory, kind: theorem, scope: "Symmetric kernels, eigenfunction expansion of the kernel and of solutions.", prereqs: [funcan.compact-self-adjoint, green.integral-equations], keywords: [hilbert-schmidt, symmetric kernel]}
              - {id: green.volterra-equations, title: Volterra equations, kind: theorem, scope: "Unique solvability of second-kind Volterra equations by iteration, Abel's equation.", prereqs: [green.neumann-series], keywords: [volterra equation, abel's equation]}

  - id: var
    title: Calculus of variations
    chapters:
      - id: variational-fundamentals
        title: The Euler-Lagrange equation
        summary: Functionals, their first variation and the equations extremals satisfy, with boundary conditions and constraints.
        sections:
          - id: euler-lagrange
            title: Extremals of functionals
            units:
              - {id: var.functionals-first-variation, title: Functionals and the first variation, kind: definition, scope: "Functionals on function spaces, admissible variations, the first variation, the fundamental lemma of the calculus of variations.", prereqs: [found.taylor-theorem], keywords: [functional, first variation, fundamental lemma]}
              - {id: var.euler-lagrange-equation, title: The Euler-Lagrange equation, kind: theorem, scope: "Derivation for fixed endpoints, smoothness assumptions, the geodesic in the plane as a first example.", prereqs: [var.functionals-first-variation], keywords: [euler-lagrange equation, euler's equation, euler equation]}
              - {id: var.first-integrals-beltrami, title: First integrals and the Beltrami identity, kind: method, scope: "Reduced cases (no y, no x), the Beltrami identity, brachistochrone and minimal surface of revolution.", prereqs: [var.euler-lagrange-equation], keywords: [beltrami, brachistochrone, first integral]}
              - {id: var.several-functions-higher-derivatives, title: Several functions and higher derivatives, kind: theorem, scope: "Systems of Euler-Lagrange equations for several dependent functions; equations for integrands with second derivatives.", prereqs: [var.euler-lagrange-equation], keywords: [several functions, higher derivatives, euler-poisson]}
              - {id: var.several-independent-variables, title: Several independent variables, kind: theorem, scope: "Euler-Lagrange equations for multiple integrals, minimal surfaces, field equations from Lagrangian densities.", prereqs: [var.euler-lagrange-equation, vcalc.divergence-theorem], keywords: [several independent variables, multiple integrals, minimal surface]}
          - id: boundary-conditions-constraints
            title: Boundary conditions and constraints
            units:
              - {id: var.natural-boundary-conditions, title: Free endpoints and natural boundary conditions, kind: theorem, scope: "Variable endpoints, natural boundary conditions, transversality conditions.", prereqs: [var.euler-lagrange-equation], keywords: [natural boundary conditions, transversality, variable end point]}
              - {id: var.isoperimetric-problems, title: Isoperimetric problems, kind: method, scope: "Integral constraints handled with a Lagrange multiplier, Dido's problem, the hanging chain.", prereqs: [var.euler-lagrange-equation, found.lagrange-multipliers], keywords: [isoperimetric, catenary, lagrange multiplier]}
              - {id: var.holonomic-constraints, title: Pointwise constraints, kind: method, scope: "Constraints g(x, y, z) = 0 imposed at every point, geodesics on a surface.", prereqs: [var.several-functions-higher-derivatives, found.lagrange-multipliers], keywords: [holonomic, constraint, geodesics]}
      - id: variational-mechanics
        title: Variational principles in mechanics
        summary: Hamilton's principle, symmetries and conservation laws, and the canonical formalism.
        sections:
          - id: hamilton
            title: Hamilton's principle and its consequences
            units:
              - {id: var.hamilton-principle, title: Hamilton's principle, kind: application, scope: "Lagrangian mechanics from stationary action, generalized coordinates, examples.", prereqs: [var.several-functions-higher-derivatives], keywords: [hamilton's principle, lagrangian, least action]}
              - {id: var.noether-theorem, title: Noether's theorem, kind: theorem, scope: "Invariance of the action under a one-parameter family of transformations and the conserved quantity it gives; energy, momentum, angular momentum.", prereqs: [var.hamilton-principle], keywords: [noether, conservation laws, invariance]}
              - {id: var.canonical-equations, title: The canonical equations, kind: theorem, scope: "Legendre transformation, canonical momenta, Hamilton's equations, first integrals.", prereqs: [var.hamilton-principle], keywords: [canonical equations, legendre transformation, hamiltonian]}
              - {id: var.hamilton-jacobi, title: The Hamilton-Jacobi equation, kind: theorem, level: advanced, scope: "The action as a function of endpoints, the Hamilton-Jacobi equation, Jacobi's theorem on complete integrals.", prereqs: [var.canonical-equations, pde.first-order-characteristics], keywords: [hamilton-jacobi, jacobi's theorem]}
      - id: variational-methods
        title: Sufficient conditions and direct methods
        summary: Second variation and the variational treatment of eigenvalue problems.
        sections:
          - id: second-variation
            title: The second variation
            units:
              - {id: var.second-variation-legendre, title: The second variation and Legendre's condition, kind: theorem, scope: "Second variation, Legendre's necessary condition for a minimum.", prereqs: [var.euler-lagrange-equation], keywords: [second variation, legendre condition]}
              - {id: var.jacobi-conjugate-points, title: Conjugate points and Jacobi's condition, kind: theorem, level: advanced, scope: "Jacobi equation, conjugate points, sufficient conditions for a weak minimum.", prereqs: [var.second-variation-legendre, ode.sturm-liouville-theory], keywords: [conjugate point, jacobi equation, jacobi's condition]}
          - id: direct-methods
            title: Variational eigenvalue problems and direct methods
            units:
              - {id: var.variational-eigenvalues, title: Variational characterization of eigenvalues, kind: theorem, scope: "Sturm-Liouville eigenvalues as minima of the Rayleigh quotient, min-max characterization (statement).", prereqs: [var.isoperimetric-problems, ode.sturm-liouville-theory], keywords: [rayleigh quotient, eigenvalue problem, variational]}
              - {id: var.rayleigh-ritz, title: The Rayleigh-Ritz method, kind: method, scope: "Trial functions, upper bounds on the lowest eigenvalue, Ritz matrices, convergence (statement).", prereqs: [var.variational-eigenvalues], keywords: [rayleigh-ritz, ritz method, trial function]}

  - id: measure
