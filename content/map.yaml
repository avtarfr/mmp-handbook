            title: Exterior calculus
            units:
              - {id: geom.differential-forms, title: Differential forms, kind: definition, scope: "Exterior algebra, wedge product, forms in R^n, pullbacks.", prereqs: [geom.tensors], keywords: [differential forms, wedge product, exterior algebra]}
              - {id: geom.exterior-derivative, title: The exterior derivative, kind: definition, scope: "Exterior derivative, d squared equals zero, correspondence with grad, curl and div.", prereqs: [geom.differential-forms, vcalc.divergence-curl], keywords: [exterior derivative]}
              - {id: geom.stokes-forms, title: Integration of forms and the general Stokes theorem, kind: theorem, scope: "Integrals of forms over oriented manifolds, the general Stokes theorem and its classical special cases.", prereqs: [geom.exterior-derivative, vcalc.stokes-theorem], keywords: [stokes' theorem, integration of forms]}
              - {id: geom.hodge-star-maxwell, title: The Hodge star and Maxwell's equations, kind: application, scope: "Hodge star, codifferential, Maxwell's equations in the language of forms.", prereqs: [geom.exterior-derivative, geom.metric-tensor], keywords: [hodge, maxwell's equations, dual]}
              - {id: geom.poincare-lemma, title: Closed and exact forms, kind: theorem, level: advanced, scope: "Poincare lemma on star-shaped domains, failure on punctured domains, de Rham cohomology idea.", prereqs: [geom.exterior-derivative], keywords: [poincare lemma, closed form, exact form]}
      - id: curves-surfaces
        title: Curves, surfaces and manifolds
