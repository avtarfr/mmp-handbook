              - {id: group.cosets-lagrange, title: Cosets and Lagrange's theorem, kind: theorem, scope: "Cosets, index, Lagrange's theorem and corollaries.", prereqs: [group.groups-subgroups], keywords: [coset, lagrange's theorem, index]}
              - {id: group.homomorphisms-quotients, title: Homomorphisms and quotient groups, kind: theorem, scope: "Homomorphisms, kernels, normal subgroups, quotient groups, first isomorphism theorem.", prereqs: [group.cosets-lagrange], keywords: [homomorphism, normal subgroup, quotient group]}
              - {id: group.group-actions, title: Group actions, kind: theorem, scope: "Actions, orbits, stabilizers, orbit-stabilizer theorem, Burnside's counting lemma.", prereqs: [group.cosets-lagrange], keywords: [group action, orbit, stabilizer]}
              - {id: group.conjugacy-classes, title: Conjugacy classes, kind: definition, scope: "Conjugation, classes, centre, class equation.", prereqs: [group.group-actions], keywords: [conjugacy class, class equation, centralizer]}
              - {id: group.symmetric-group, title: The symmetric group, kind: definition, scope: "Permutations, cycle notation, transpositions, sign, alternating group.", prereqs: [group.groups-subgroups], keywords: [symmetric group, permutation, cycle]}
              - {id: group.point-groups, title: Point groups and crystal symmetry, kind: application, level: advanced, scope: "Point groups in two and three dimensions, the crystallographic restriction.", prereqs: [group.conjugacy-classes], keywords: [point group, crystallographic, symmetry operations]}
              - {id: group.rings-fields, title: Rings and fields, kind: definition, scope: "Rings, ideals, quotient rings, integral domains, fields, polynomial rings, the fields the handbook uses (Q, R, C, finite fields).", prereqs: [group.homomorphisms-quotients], keywords: [ring, ideal, field]}
              - {id: group.quaternions, title: Quaternions, kind: definition, scope: "The quaternion algebra, conjugate and norm, unit quaternions as rotations of three-space, relation to SU(2) and to Pauli matrices.", prereqs: [group.groups-subgroups, linalg.linear-maps-matrices], keywords: [quaternion, unit quaternion, rotation]}
      - id: representations
        title: Representations of finite groups
        summary: Representations, characters and their uses.
        sections:
          - id: finite
            title: Representations and characters
            units:
              - {id: group.representations, title: Representations of groups, kind: definition, scope: "Representations, equivalence, reducibility, unitarity for finite groups, Maschke's theorem.", prereqs: [group.homomorphisms-quotients, linalg.unitary-orthogonal-matrices], keywords: [representation, irreducible representation, reducible]}
              - {id: group.schur-lemma, title: Schur's lemma, kind: theorem, scope: "Both forms of Schur's lemma and consequences.", prereqs: [group.representations], keywords: [schur's lemma]}
              - {id: group.orthogonality-characters, title: Orthogonality relations and characters, kind: theorem, scope: "Great orthogonality theorem, characters, decomposition of representations, regular representation.", prereqs: [group.schur-lemma, group.conjugacy-classes], keywords: [orthogonality theorem, character, irreducible]}
              - {id: group.character-tables, title: Character tables, kind: method, scope: "Constructing and using character tables, decomposition examples.", prereqs: [group.orthogonality-characters], keywords: [character table]}
              - {id: group.product-representations, title: Product representations and selection rules, kind: method, scope: "Tensor products of representations, Clebsch-Gordan series for finite groups, selection rules.", prereqs: [group.orthogonality-characters], keywords: [direct product, selection rules, product representation]}
      - id: lie
        title: Lie groups and angular momentum
        summary: Continuous groups, rotations and the theory of angular momentum.
        sections:
          - id: lie
            title: Lie groups and rotations
            units:
              - {id: group.lie-groups-algebras, title: Matrix Lie groups and Lie algebras, kind: definition, scope: "Matrix Lie groups, generators, the exponential map, Lie brackets, structure constants.", prereqs: [linalg.matrix-exponential, group.groups-subgroups], keywords: [lie group, lie algebra, generators]}
              - {id: group.so3-su2, title: The rotation group and SU(2), kind: theorem, scope: "SO(3) and its generators, SU(2), the two-to-one homomorphism, spinors.", prereqs: [group.lie-groups-algebras], keywords: [rotation group, su(2), so(3)]}
              - {id: group.angular-momentum, title: Angular momentum algebra, kind: theorem, scope: "Commutation relations, ladder operators, the spectrum j and m, matrix elements.", prereqs: [group.so3-su2], keywords: [angular momentum, ladder operators, commutation relations]}
              - {id: group.clebsch-gordan, title: Addition of angular momenta, kind: method, scope: "Coupled and uncoupled bases, Clebsch-Gordan coefficients, their computation and symmetries.", prereqs: [group.angular-momentum, group.product-representations], keywords: [clebsch-gordan, coupling, addition of angular momentum]}
              - {id: group.wigner-d-matrices, title: Rotation matrices of angular momentum, kind: definition, level: advanced, scope: "Wigner D-matrices, Euler angles, relation to spherical harmonics.", prereqs: [group.angular-momentum, spec.spherical-harmonics], keywords: [rotation matrix, euler angles, wigner]}
              - {id: group.wigner-eckart, title: Spherical tensors and the Wigner-Eckart theorem, kind: theorem, level: advanced, scope: "Spherical tensor operators, the Wigner-Eckart theorem, reduced matrix elements.", prereqs: [group.clebsch-gordan], keywords: [wigner-eckart, spherical tensor, reduced matrix element]}
              - {id: group.lorentz-group, title: The Lorentz group, kind: definition, level: advanced, scope: "Lorentz transformations, generators, boosts and rotations, relation to SL(2,C).", prereqs: [group.lie-groups-algebras], keywords: [lorentz group, lorentz transformation, boost]}
              - {id: group.matrix-group-catalogue, title: The classical matrix groups, kind: table, scope: "GL(n), SL(n), O(n), SO(n), U(n), SU(n), Sp(2n): defining conditions, dimensions, compactness and connectedness, and their Lie algebras.", prereqs: [group.lie-groups-algebras], keywords: [general linear group, orthogonal group, special linear group]}
              - {id: group.casimir-operators, title: Casimir operators, kind: definition, level: advanced, scope: "Operators commuting with all generators, the quadratic Casimir, labelling irreducible representations, J^2 for angular momentum.", prereqs: [group.angular-momentum], keywords: [casimir operator, invariant operator, quadratic casimir]}
              - {id: group.clifford-algebras, title: Clifford algebras and spinors, kind: definition, level: advanced, scope: "Clifford algebra of a quadratic form, gamma matrices, Pauli and Dirac algebras, spinor representations, relation to quaternions.", prereqs: [group.quaternions, group.so3-su2], keywords: [clifford algebra, spinor, gamma matrices]}

  - id: geom
    title: Tensors, forms and geometry
