# Topic map of the handbook: part -> chapter -> section -> units.
#
# This structure is our own and deliberately does not follow any one book's table of contents.
# Each unit entry is a spec for its drafter:
#   id        <part>.<slug>; the unit file is content/<part>/<id>.md
#   title     unit title
#   kind      overview | definition | theorem | method | example | application | table
#   level     core (default) | advanced
#   scope     what the unit must cover (and, implicitly, what it need not)
#   prereqs   units it builds on
#   keywords  phrases used to find candidate source pages (tools/map.mjs candidates)
# Chapters are the batches in which units are drafted and verified.

parts:
  - id: found
    title: Foundations of analysis
    chapters:
      - id: sequences-series
        title: Sequences and series
        summary: Convergence of sequences, series and series of functions, and the expansions built on them.
        sections:
          - id: convergence
            title: Convergence of sequences and series
            units:
              - {id: found.limits-of-sequences, title: Limits of sequences and completeness, kind: definition, scope: "Limit of a sequence, Cauchy sequences, completeness of the real numbers, monotone convergence, limsup and liminf.", prereqs: [], keywords: [cauchy sequence, convergent sequence, monotone]}
              - {id: found.series-convergence-tests, title: Convergence tests for series, kind: method, scope: "Partial sums; comparison, ratio, root, integral and alternating-series tests, with when each is decisive.", prereqs: [found.limits-of-sequences], keywords: [ratio test, comparison test, integral test]}
              - {id: found.absolute-convergence, title: Absolute and conditional convergence, kind: theorem, scope: "Absolute convergence implies convergence; rearrangements of absolutely convergent series; Riemann's rearrangement theorem; Cauchy product.", prereqs: [found.series-convergence-tests], keywords: [absolute convergence, conditionally convergent, rearrangement]}
          - id: function-series
            title: Series of functions
            units:
              - {id: found.uniform-convergence, title: Uniform convergence, kind: theorem, scope: "Pointwise versus uniform convergence; the Weierstrass M-test; a uniform limit of continuous functions is continuous.", prereqs: [found.limits-of-sequences], keywords: [uniform convergence, weierstrass m test, uniformly convergent]}
              - {id: found.termwise-operations, title: Integrating and differentiating series term by term, kind: theorem, scope: "Interchange of limit and integral under uniform convergence; termwise differentiation theorem; counterexamples when uniformity fails.", prereqs: [found.uniform-convergence], keywords: [term by term, termwise, uniformly convergent]}
              - {id: found.power-series, title: Power series, kind: theorem, scope: "Radius of convergence (Cauchy-Hadamard), uniform convergence inside it, termwise differentiation and integration, Abel's theorem at the boundary.", prereqs: [found.termwise-operations, found.series-convergence-tests], keywords: [power series, radius of convergence, interval of convergence]}
              - {id: found.taylor-theorem, title: Taylor's theorem, kind: theorem, scope: "Taylor polynomials with Lagrange and integral remainders; standard Maclaurin series and their ranges; a smooth function whose Taylor series does not represent it.", prereqs: [found.power-series], keywords: [taylor series, taylor's theorem, maclaurin]}
      - id: multivariable
        title: Calculus of several variables
        summary: Differentiation, extrema and integration in several variables.
        sections:
          - id: differentiation
            title: Differentiation and extrema
            units:
              - {id: found.partial-derivatives-chain-rule, title: Partial derivatives and the chain rule, kind: method, scope: "Partial derivatives, differentiability, total differential, Jacobian matrix, chain rule in matrix form, equality of mixed partials.", prereqs: [], keywords: [partial derivative, chain rule, total differential]}
              - {id: found.taylor-several-variables, title: Taylor expansion and critical points in several variables, kind: theorem, scope: "Second-order Taylor expansion, the Hessian, classification of critical points by definiteness.", prereqs: [found.partial-derivatives-chain-rule, found.taylor-theorem], keywords: [stationary point, saddle point, hessian]}
              - {id: found.implicit-inverse-function, title: Implicit and inverse function theorems, kind: theorem, scope: "Statements in n dimensions, Jacobian conditions, derivative formulas, local nature; examples.", prereqs: [found.partial-derivatives-chain-rule], keywords: [implicit function theorem, inverse function theorem, jacobian]}
              - {id: found.lagrange-multipliers, title: Lagrange multipliers, kind: method, scope: "Constrained extrema with one or several equality constraints, geometric meaning, justification via the implicit function theorem.", prereqs: [found.implicit-inverse-function, found.taylor-several-variables], keywords: [lagrange multiplier, lagrange undetermined multiplier, constrained]}
          - id: integration
            title: Integration
            units:
              - {id: found.change-of-variables, title: Multiple integrals and change of variables, kind: method, scope: "Iterated integrals, the Jacobian determinant in a change of variables, polar, cylindrical and spherical coordinates.", prereqs: [found.partial-derivatives-chain-rule], keywords: [change of variables, jacobian, multiple integral]}
              - {id: found.differentiation-under-integral, title: Differentiation under the integral sign, kind: theorem, scope: "Leibniz rule with variable limits; sufficient conditions; use to evaluate integrals.", prereqs: [found.uniform-convergence], keywords: [differentiation under the integral, leibniz, integral sign]}
              - {id: found.gaussian-integrals, title: Gaussian integrals, kind: method, scope: "The Gaussian integral, moments, completing the square, the multivariate Gaussian integral with a positive definite matrix.", prereqs: [found.change-of-variables], keywords: [gaussian integral, error integral]}
      - id: sets-topology
        title: Sets, topology and continuity
        summary: The language of sets, open sets, continuity and compactness that the rest of the handbook assumes.
        sections:
          - id: sets
            title: Sets and functions
            units:
              - {id: found.sets-cardinality, title: "Sets, functions and countability", kind: definition, scope: "Set operations, images and inverse images, injective/surjective/bijective maps, countable and uncountable sets, Cantor's diagonal argument, cardinality.", prereqs: [], keywords: [cardinality, countable, inverse image]}
              - {id: found.zorn-lemma, title: Zorn's lemma and the axiom of choice, kind: theorem, level: advanced, scope: "Partial orders, chains, Zorn's lemma, equivalence with the axiom of choice (statement), typical uses such as existence of a basis or of a maximal ideal.", prereqs: [found.sets-cardinality], keywords: [zorn's lemma, axiom of choice, partially ordered]}
          - id: topology
            title: Topological spaces
            units:
              - {id: found.topological-spaces, title: Topological and metric spaces, kind: definition, scope: "Open and closed sets, neighbourhoods, interior, closure and boundary, the metric topology, subspace topology, Hausdorff spaces, bases.", prereqs: [found.sets-cardinality], keywords: [topological space, neighborhood, open set]}
              - {id: found.continuity-homeomorphism, title: Continuity and homeomorphism, kind: definition, scope: "Continuity by preimages of open sets and its equivalence with the epsilon-delta definition on metric spaces; homeomorphisms; topological properties.", prereqs: [found.topological-spaces], keywords: [homeomorphism, continuous mapping, continuity]}
              - {id: found.compactness, title: Compactness, kind: theorem, scope: "Open-cover compactness, sequential compactness, Heine-Borel and Bolzano-Weierstrass theorems, continuous images of compact sets, extreme value theorem.", prereqs: [found.continuity-homeomorphism], keywords: [compactness, heine-borel, bolzano weierstrass]}
              - {id: found.connectedness-homotopy, title: Connectedness and simple connectivity, kind: definition, scope: "Connected and path-connected sets, components, homotopy of paths, simply connected domains and why they matter for potentials and contour integrals.", prereqs: [found.continuity-homeomorphism], keywords: [connected, homotopy, simply connected]}

  - id: linalg
    title: Linear algebra
    chapters:
      - id: vector-spaces
        title: Vector spaces and linear maps
        summary: Bases, matrices, determinants, linear systems and inner products.
        sections:
          - id: spaces
            title: Spaces, maps and determinants
            units:
              - {id: linalg.vector-spaces-bases, title: Vector spaces and bases, kind: definition, scope: "Vector spaces over R and C, subspaces, linear independence, span, basis, dimension, function spaces as examples.", prereqs: [], keywords: [vector space, linear independence, basis]}
              - {id: linalg.linear-maps-matrices, title: Linear maps and matrices, kind: definition, scope: "Linear maps, matrix of a map in a basis, composition and products, change of basis and similarity.", prereqs: [linalg.vector-spaces-bases], keywords: [linear operator, matrix representation, change of basis]}
              - {id: linalg.determinants, title: Determinants, kind: theorem, scope: "Definition via permutations, properties, cofactor expansion, product rule, invertibility, volume interpretation.", prereqs: [linalg.linear-maps-matrices], keywords: [determinant, cofactor, laplace expansion]}
              - {id: linalg.linear-systems, title: Linear systems and rank, kind: method, scope: "Gaussian elimination, rank, rank-nullity, solvability of Ax=b and the finite-dimensional Fredholm alternative.", prereqs: [linalg.linear-maps-matrices], keywords: [gaussian elimination, rank, simultaneous linear equations]}
          - id: inner-products
            title: Inner products and orthogonality
            units:
              - {id: linalg.inner-product-spaces, title: Inner products and norms, kind: definition, scope: "Real and complex inner products, induced norm, Cauchy-Schwarz and triangle inequalities, orthogonality.", prereqs: [linalg.vector-spaces-bases], keywords: [inner product, schwarz inequality, norm]}
              - {id: linalg.gram-schmidt, title: Orthonormal bases and Gram-Schmidt, kind: method, scope: "Gram-Schmidt orthogonalization, orthonormal expansions, QR factorization.", prereqs: [linalg.inner-product-spaces], keywords: [gram-schmidt, orthonormal, orthogonalization]}
              - {id: linalg.projections-least-squares, title: Orthogonal projection and least squares, kind: theorem, scope: "Orthogonal projection onto a subspace, best approximation, normal equations for least squares.", prereqs: [linalg.gram-schmidt, linalg.linear-systems], keywords: [least squares, projection, normal equations]}
      - id: eigen
        title: Eigenvalues and matrix decompositions
        summary: Spectral theory of matrices and its uses.
        sections:
          - id: eigenvalues
            title: Eigenvalues and diagonalization
            units:
              - {id: linalg.eigenvalues-eigenvectors, title: Eigenvalues and eigenvectors, kind: definition, scope: "Characteristic polynomial, eigenspaces, algebraic and geometric multiplicity, diagonalizability, trace and determinant as sum and product.", prereqs: [linalg.determinants], keywords: [eigenvalue, eigenvector, characteristic equation]}
              - {id: linalg.hermitian-spectral-theorem, title: Spectral theorem for Hermitian matrices, kind: theorem, scope: "Hermitian (real symmetric) matrices have real eigenvalues and an orthonormal eigenbasis; unitary diagonalization.", prereqs: [linalg.eigenvalues-eigenvectors, linalg.gram-schmidt], keywords: [hermitian matrix, real symmetric matrix, diagonalization]}
              - {id: linalg.unitary-orthogonal-matrices, title: Unitary and orthogonal matrices, kind: definition, scope: "Unitary and orthogonal matrices, preservation of inner products, rotations and reflections, eigenvalues on the unit circle.", prereqs: [linalg.inner-product-spaces, linalg.eigenvalues-eigenvectors], keywords: [unitary matrix, orthogonal matrix, rotation matrix]}
              - {id: linalg.normal-matrices, title: Normal matrices and simultaneous diagonalization, kind: theorem, scope: "Normal matrices are unitarily diagonalizable; commuting Hermitian matrices share an eigenbasis.", prereqs: [linalg.hermitian-spectral-theorem], keywords: [normal matrix, commuting matrices, simultaneous]}
              - {id: linalg.jordan-form, title: Jordan normal form, kind: theorem, level: advanced, scope: "Statement, generalized eigenvectors, use for matrix powers and exponentials of defective matrices.", prereqs: [linalg.eigenvalues-eigenvectors], keywords: [jordan normal form, jordan canonical form, generalized eigenvector]}
          - id: decompositions
            title: Quadratic forms, SVD and matrix functions
            units:
              - {id: linalg.quadratic-forms, title: Quadratic forms and the Rayleigh quotient, kind: method, scope: "Quadratic forms, definiteness, principal axes, Sylvester's criterion, Rayleigh quotient bounds on eigenvalues.", prereqs: [linalg.hermitian-spectral-theorem], keywords: [quadratic form, rayleigh quotient, positive definite]}
              - {id: linalg.normal-modes, title: Generalized eigenproblems and normal modes, kind: application, scope: "Ax = lambda Bx with B positive definite; small oscillations of coupled systems and their normal modes.", prereqs: [linalg.quadratic-forms], keywords: [normal modes, normal coordinates, small oscillations]}
              - {id: linalg.svd, title: Singular value decomposition, kind: theorem, scope: "Existence of the SVD, relation to eigenvalues of A*A, best low-rank approximation (Eckart-Young), pseudoinverse.", prereqs: [linalg.hermitian-spectral-theorem, linalg.projections-least-squares], keywords: [singular value decomposition, singular values, pseudoinverse]}
              - {id: linalg.matrix-exponential, title: Functions of matrices and the matrix exponential, kind: method, scope: "Matrix power series, the exponential and its properties (including when exp(A+B) = exp(A)exp(B)), computing via diagonalization.", prereqs: [linalg.eigenvalues-eigenvectors, found.power-series], keywords: [matrix exponential, functions of matrices, exponential of a matrix]}
              - {id: linalg.matrix-norms-conditioning, title: Matrix norms and condition numbers, kind: definition, scope: "Induced matrix norms, spectral norm, condition number and sensitivity of linear systems to perturbation.", prereqs: [linalg.svd], keywords: [matrix norm, condition number, ill-conditioned]}

  - id: vcalc
    title: Vector calculus
    chapters:
      - id: fields
        title: Vector fields and their derivatives
        summary: Vector algebra, gradient, divergence and curl.
        sections:
          - id: algebra-and-derivatives
            title: Vector algebra and differential operators
            units:
              - {id: vcalc.vector-algebra, title: Vector algebra and index notation, kind: definition, scope: "Scalar, vector and triple products; Kronecker delta and Levi-Civita symbol; the epsilon-delta identity.", prereqs: [], keywords: [triple product, levi-civita, kronecker delta]}
              - {id: vcalc.gradient, title: Gradient and directional derivative, kind: definition, scope: "Gradient, directional derivative, normal to level surfaces.", prereqs: [found.partial-derivatives-chain-rule, vcalc.vector-algebra], keywords: [gradient, directional derivative, level surface]}
              - {id: vcalc.divergence-curl, title: "Divergence, curl and the Laplacian", kind: definition, scope: "Divergence and curl in Cartesian coordinates, their physical meaning, the Laplacian.", prereqs: [vcalc.gradient], keywords: [divergence, curl, laplacian]}
              - {id: vcalc.vector-identities, title: Vector differential identities, kind: method, scope: "Product rules and second-derivative identities, proved with index notation.", prereqs: [vcalc.divergence-curl], keywords: [vector identities, curl of curl, divergence of curl]}
      - id: integral-theorems
        title: Integral theorems
        summary: Line and surface integrals, Gauss, Stokes and Green, potentials.
        sections:
          - id: integrals
            title: Integrals and the integral theorems
            units:
              - {id: vcalc.line-integrals, title: Line integrals and conservative fields, kind: theorem, scope: "Line integrals, path independence, conservative fields and potentials, the role of simple connectivity.", prereqs: [vcalc.gradient], keywords: [line integral, conservative field, path independence]}
              - {id: vcalc.surface-integrals, title: Surface integrals and flux, kind: definition, scope: "Parametrized surfaces, surface element, orientation, flux integrals.", prereqs: [found.change-of-variables, vcalc.vector-algebra], keywords: [surface integral, flux, surface element]}
              - {id: vcalc.divergence-theorem, title: The divergence theorem, kind: theorem, scope: "Gauss's theorem, a proof for simple regions, consequences, continuity equation.", prereqs: [vcalc.surface-integrals, vcalc.divergence-curl], keywords: [divergence theorem, gauss's theorem, gauss theorem]}
              - {id: vcalc.stokes-theorem, title: Stokes' theorem and Green's theorem in the plane, kind: theorem, scope: "Green's theorem in the plane, Stokes' theorem, orientation conventions, circulation.", prereqs: [vcalc.surface-integrals, vcalc.line-integrals], keywords: [stokes' theorem, green's theorem, circulation]}
              - {id: vcalc.green-identities, title: Green's identities, kind: theorem, scope: "Green's first and second identities and uniqueness arguments for Laplace's equation.", prereqs: [vcalc.divergence-theorem], keywords: [green's theorem, green's first, green's second]}
          - id: potentials
            title: Potentials
            units:
              - {id: vcalc.helmholtz-decomposition, title: Helmholtz decomposition and potentials, kind: theorem, scope: "Scalar and vector potentials; Helmholtz theorem for fields decaying at infinity; gauge freedom.", prereqs: [vcalc.divergence-theorem, vcalc.stokes-theorem], keywords: [helmholtz's theorem, vector potential, scalar potential]}
              - {id: vcalc.dirac-delta-basics, title: The Dirac delta in calculations, kind: definition, scope: "Delta as a limit of peaked functions, sifting property, three-dimensional delta, Laplacian of 1/r.", prereqs: [vcalc.divergence-theorem], keywords: [dirac delta, delta function, sifting]}
      - id: curvilinear
        title: Curvilinear coordinates
        summary: Differential operators in orthogonal coordinate systems.
        sections:
          - id: coordinates
            title: Orthogonal curvilinear coordinates
            units:
              - {id: vcalc.curvilinear-coordinates, title: Orthogonal curvilinear coordinates, kind: method, scope: "Scale factors, unit vectors, line, area and volume elements; general formulas for grad, div, curl and Laplacian.", prereqs: [vcalc.divergence-curl, found.change-of-variables], keywords: [curvilinear coordinates, scale factors, orthogonal coordinates]}
              - {id: vcalc.cylindrical-spherical, title: Cylindrical and spherical coordinates, kind: table, scope: "Explicit formulas for the differential operators in cylindrical and spherical polar coordinates, with derivations of the Laplacian.", prereqs: [vcalc.curvilinear-coordinates], keywords: [spherical polar coordinates, cylindrical coordinates, laplacian]}

  - id: complex
    title: Complex analysis
    chapters:
      - id: analytic-functions
        title: Analytic functions and Cauchy's theorem
        summary: Differentiability in the complex plane and contour integration.
        sections:
          - id: functions
            title: Complex functions
            units:
              - {id: complex.elementary-functions, title: Complex numbers and elementary functions, kind: definition, scope: "Polar form, the exponential, logarithm, powers and trigonometric functions of a complex variable.", prereqs: [], keywords: [complex exponential, polar form, complex logarithm]}
              - {id: complex.cauchy-riemann, title: Analyticity and the Cauchy-Riemann equations, kind: theorem, scope: "Complex differentiability, Cauchy-Riemann equations (necessity and sufficiency with continuous partials), harmonic conjugates.", prereqs: [complex.elementary-functions, found.partial-derivatives-chain-rule], keywords: [cauchy-riemann, analytic function, harmonic]}
              - {id: complex.branch-points-cuts, title: Branch points and branch cuts, kind: definition, scope: "Multivalued functions, branches of log and powers, branch points, choosing cuts, sheets.", prereqs: [complex.elementary-functions], keywords: [branch point, branch cut, multivalued]}
          - id: integration
            title: Contour integration
            units:
              - {id: complex.contour-integrals, title: Contour integrals, kind: definition, scope: "Integrals along curves, parametrization, the ML estimate, fundamental theorem for analytic antiderivatives.", prereqs: [complex.elementary-functions], keywords: [contour integral, contour integration, ml]}
              - {id: complex.cauchy-theorem, title: Cauchy's theorem, kind: theorem, scope: "Cauchy-Goursat theorem for simply connected domains, deformation of contours, multiply connected regions.", prereqs: [complex.contour-integrals, complex.cauchy-riemann], keywords: [cauchy's integral theorem, cauchy-goursat, simply connected]}
              - {id: complex.cauchy-integral-formula, title: Cauchy's integral formula, kind: theorem, scope: "The integral formula and its derivatives; analytic functions are infinitely differentiable; Morera's theorem.", prereqs: [complex.cauchy-theorem], keywords: [cauchy's integral formula, morera]}
              - {id: complex.liouville-maximum-modulus, title: Liouville's theorem and the maximum modulus principle, kind: theorem, scope: "Cauchy estimates, Liouville, fundamental theorem of algebra, maximum modulus principle.", prereqs: [complex.cauchy-integral-formula], keywords: [liouville's theorem, maximum modulus, fundamental theorem of algebra]}
      - id: singularities-residues
        title: Series, singularities and residues
        summary: Taylor and Laurent series, classification of singularities and the residue calculus.
        sections:
          - id: series
            title: Taylor and Laurent series
            units:
              - {id: complex.taylor-series, title: Taylor series of analytic functions, kind: theorem, scope: "Analytic functions have convergent Taylor series; radius equals distance to nearest singularity; zeros are isolated.", prereqs: [complex.cauchy-integral-formula, found.power-series], keywords: [taylor series, taylor expansion, radius of convergence]}
              - {id: complex.laurent-series, title: Laurent series, kind: theorem, scope: "Laurent expansion in an annulus, uniqueness, computing coefficients in practice.", prereqs: [complex.taylor-series], keywords: [laurent series, laurent expansion, annulus]}
              - {id: complex.singularities, title: Classification of isolated singularities, kind: definition, scope: "Removable singularities, poles, essential singularities (Casorati-Weierstrass), behaviour at infinity, meromorphic functions.", prereqs: [complex.laurent-series], keywords: [essential singularity, pole, removable singularity]}
              - {id: complex.analytic-continuation, title: Analytic continuation, kind: theorem, scope: "Identity theorem, uniqueness of continuation, continuation along paths, the Gamma function as an example.", prereqs: [complex.taylor-series], keywords: [analytic continuation, identity theorem]}
          - id: residues
            title: The residue calculus
            units:
              - {id: complex.residue-theorem, title: The residue theorem, kind: theorem, scope: "Residue theorem; formulas for residues at simple and higher-order poles.", prereqs: [complex.singularities], keywords: [residue theorem, residues, calculus of residues]}
              - {id: complex.trigonometric-integrals, title: Trigonometric integrals by residues, kind: method, scope: "Integrals over a period of rational functions of sine and cosine via the unit circle.", prereqs: [complex.residue-theorem], keywords: [trigonometric integrals, unit circle, residues]}
              - {id: complex.infinite-integrals, title: Infinite real integrals and Jordan's lemma, kind: method, scope: "Rational integrands over the real line, Fourier-type integrals, Jordan's lemma, closing contours.", prereqs: [complex.residue-theorem], keywords: [jordan's lemma, infinite integral, semicircle]}
              - {id: complex.branch-cut-integrals, title: Integrals around branch cuts, kind: method, scope: "Keyhole and dogbone contours for integrands with powers and logarithms.", prereqs: [complex.residue-theorem, complex.branch-points-cuts], keywords: [keyhole contour, branch cut, contour]}
              - {id: complex.principal-value-integrals, title: Principal values and indented contours, kind: method, scope: "Cauchy principal value, indentation around poles on the contour, the Sokhotski-Plemelj formula.", prereqs: [complex.infinite-integrals], keywords: [principal value, indented contour, plemelj]}
              - {id: complex.series-summation, title: Summing series with residues, kind: method, scope: "Summation of series using pi cot(pi z) and pi csc(pi z) kernels.", prereqs: [complex.residue-theorem], keywords: [summation of series, cot, residues]}
              - {id: complex.argument-principle-rouche, title: Argument principle and Rouche's theorem, kind: theorem, scope: "Counting zeros and poles, Rouche's theorem, locating roots of polynomials.", prereqs: [complex.residue-theorem], keywords: [argument principle, rouche's theorem]}
              - {id: complex.winding-number, title: The winding number, kind: definition, scope: "Index of a closed curve about a point, its integral formula, invariance under homotopy, the general (homology) form of Cauchy's theorem.", prereqs: [complex.contour-integrals, found.connectedness-homotopy], keywords: [winding number, index of a curve, homology]}
      - id: further-complex
        title: Mappings and applications
        summary: Conformal maps, dispersion relations and pole expansions.
        sections:
          - id: applications
            title: Conformal maps and applications
            units:
              - {id: complex.conformal-mappings, title: Conformal mappings, kind: method, scope: "Conformality, Mobius transformations, standard maps, solving two-dimensional Laplace problems by mapping.", prereqs: [complex.cauchy-riemann], keywords: [conformal mapping, bilinear transformation, mobius]}
              - {id: complex.dispersion-relations, title: Dispersion relations, kind: application, scope: "Kramers-Kronig relations from causality and analyticity in the upper half-plane.", prereqs: [complex.principal-value-integrals], keywords: [dispersion relations, kramers-kronig]}
              - {id: complex.pole-expansions-products, title: Pole expansions and infinite products, kind: theorem, level: advanced, scope: "Mittag-Leffler pole expansions (cot), Weierstrass products, the product for sin.", prereqs: [complex.residue-theorem], keywords: [mittag-leffler, infinite product, pole expansion]}
              - {id: complex.riemann-surfaces, title: Riemann surfaces, kind: definition, level: advanced, scope: "The surface of a multivalued function, sheets and branch cuts glued, the surfaces of the square root and the logarithm, uniformization idea.", prereqs: [complex.branch-points-cuts, complex.analytic-continuation], keywords: [riemann surface, sheet, multivalued]}

  - id: ode
    title: Ordinary differential equations
    chapters:
      - id: first-order-theory
        title: First-order equations and existence theory
        summary: Elementary methods and the existence, uniqueness and stability of solutions.
        sections:
          - id: basics
            title: Methods and existence
            units:
              - {id: ode.first-order-methods, title: Solving first-order equations, kind: method, scope: "Separable, exact and linear equations, integrating factors, Bernoulli and homogeneous equations.", prereqs: [], keywords: [integrating factor, exact equation, separable]}
              - {id: ode.existence-uniqueness, title: Existence and uniqueness of solutions, kind: theorem, scope: "Picard-Lindelof theorem via successive approximations under a Lipschitz condition; nonuniqueness example without it.", prereqs: [found.uniform-convergence], keywords: [lipschitz condition, successive approximations, existence and uniqueness]}
              - {id: ode.continuous-dependence, title: Dependence on initial data and Gronwall's inequality, kind: theorem, level: advanced, scope: "Gronwall's inequality, continuous dependence on initial conditions and parameters, maximal intervals of existence.", prereqs: [ode.existence-uniqueness], keywords: [gronwall, continuous dependence, initial conditions]}
      - id: linear-equations
        title: Linear equations
        summary: Structure of solutions of linear ODEs and the standard solution methods.
        sections:
          - id: linear
            title: Linear equations of order n
            units:
              - {id: ode.linear-ode-theory, title: Structure of linear equations and the Wronskian, kind: theorem, scope: "Solution space has dimension n, fundamental sets, the Wronskian and Abel's formula, superposition.", prereqs: [ode.existence-uniqueness, linalg.determinants], keywords: [wronskian, linearly independent solutions, fundamental set]}
              - {id: ode.constant-coefficients, title: Constant-coefficient equations, kind: method, scope: "Characteristic equation, repeated and complex roots, undetermined coefficients, resonance.", prereqs: [ode.linear-ode-theory], keywords: [constant coefficients, auxiliary equation, characteristic equation]}
              - {id: ode.variation-of-parameters, title: Variation of parameters, kind: method, scope: "Particular solutions from a fundamental set, second-order formula, general order.", prereqs: [ode.linear-ode-theory], keywords: [variation of parameters, particular integral]}
              - {id: ode.reduction-of-order, title: Reduction of order, kind: method, scope: "Second solution from a known one, Abel's formula route.", prereqs: [ode.linear-ode-theory], keywords: [second solution, reduction of order]}
              - {id: ode.euler-equation, title: Euler-Cauchy equations, kind: method, scope: "Equidimensional equations, power solutions, logarithmic cases.", prereqs: [ode.constant-coefficients], keywords: [euler equation, equidimensional, cauchy-euler]}
              - {id: ode.harmonic-oscillator, title: The damped and driven harmonic oscillator, kind: application, scope: "Free, damped (under-, over- and critically damped) and driven oscillator; resonance, quality factor, phase lag, transient and steady state.", prereqs: [ode.constant-coefficients], keywords: [harmonic oscillator, resonance, damped]}
          - id: series-solutions
            title: Series solutions
            units:
              - {id: ode.ordinary-point-series, title: Power-series solutions at ordinary points, kind: method, scope: "Recurrences for coefficients, radius of convergence from the coefficients' singularities.", prereqs: [ode.linear-ode-theory, complex.taylor-series], keywords: [ordinary point, series solution, power series]}
              - {id: ode.frobenius-method, title: The Frobenius method, kind: method, scope: "Regular singular points, indicial equation, the cases of roots differing by an integer, logarithmic solutions.", prereqs: [ode.ordinary-point-series], keywords: [frobenius, indicial equation, regular singular point]}
