              - {id: funcan.compact-operators, title: Compact operators, kind: definition, scope: "Compact operators, limits of finite-rank operators, integral operators with square-integrable kernels.", prereqs: [funcan.bounded-operators], keywords: [compact operator, finite rank]}
              - {id: funcan.compact-self-adjoint, title: Spectral theorem for compact self-adjoint operators, kind: theorem, scope: "Eigenvalues accumulate only at zero, eigenvector expansion, application to Sturm-Liouville problems.", prereqs: [funcan.compact-operators, funcan.adjoint-operators, funcan.orthonormal-bases], keywords: [compact self-adjoint, spectral theorem, hilbert-schmidt]}
              - {id: funcan.uniform-boundedness-open-mapping, title: Uniform boundedness and open mapping theorems, kind: theorem, level: advanced, scope: "Statements, consequences (bounded inverse, closed graph), examples.", prereqs: [funcan.bounded-operators], keywords: [uniform boundedness, open mapping, closed graph]}
