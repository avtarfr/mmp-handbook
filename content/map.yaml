              - {id: funcan.spectral-theorem-general, title: The spectral theorem, kind: theorem, level: advanced, scope: "Spectral theorem for self-adjoint operators in multiplication-operator and spectral-measure forms, functional calculus.", prereqs: [funcan.symmetric-self-adjoint, measure.lebesgue-integral], keywords: [spectral theorem, functional calculus, spectral measure]}
              - {id: funcan.stone-theorem, title: Stone's theorem, kind: theorem, level: advanced, scope: "Strongly continuous unitary groups and self-adjoint generators; time evolution in quantum mechanics.", prereqs: [funcan.spectral-theorem-general], keywords: [stone's theorem, unitary group, generator]}
