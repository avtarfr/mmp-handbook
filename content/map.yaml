              - {id: geom.tangent-vectors, title: Tangent vectors and vector fields, kind: definition, level: advanced, scope: "Tangent spaces as derivations, vector fields, flows, Lie brackets.", prereqs: [geom.smooth-manifolds], keywords: [tangent space, vector field, lie bracket]}
              - {id: geom.riemann-curvature, title: The Riemann curvature tensor, kind: definition, level: advanced, scope: "Riemann tensor from commutators of covariant derivatives, symmetries, Ricci tensor and scalar, flatness.", prereqs: [geom.covariant-derivative], keywords: [riemann tensor, curvature tensor, ricci]}
              - {id: geom.riemannian-metrics, title: Riemannian manifolds, kind: definition, level: advanced, scope: "Riemannian metric on a manifold, lengths and volumes, the Levi-Civita connection, geodesics and curvature in this language, pseudo-Riemannian signature.", prereqs: [geom.smooth-manifolds, geom.metric-tensor], keywords: [riemannian manifold, riemannian metric, levi-civita]}
              - {id: geom.vector-bundles, title: Tangent and vector bundles, kind: definition, level: advanced, scope: "Tangent bundle, general vector bundles, sections, local trivializations, the cotangent bundle and tensor bundles.", prereqs: [geom.tangent-vectors], keywords: [vector bundle, tangent bundle, section]}
              - {id: geom.pullbacks-pushforwards, title: "Pushforwards, pullbacks and immersions", kind: definition, level: advanced, scope: "Differential of a smooth map, pushforward of vectors, pullback of forms and metrics, immersions, submersions and embeddings.", prereqs: [geom.tangent-vectors, geom.differential-forms], keywords: [pullback, pushforward, immersion]}
              - {id: geom.flows-integral-curves, title: Flows and integral curves, kind: theorem, level: advanced, scope: "Integral curves of a vector field, local flow and the fundamental theorem on flows, one-parameter groups, the Lie derivative along a flow.", prereqs: [geom.tangent-vectors, ode.existence-uniqueness], keywords: [integral curve, flow, lie derivative]}
              - {id: geom.exponential-map, title: The exponential map, kind: definition, level: advanced, scope: "Exponential map of a Lie group from its algebra and of a Riemannian manifold from geodesics; normal coordinates; relation to the matrix exponential.", prereqs: [geom.flows-integral-curves, group.lie-groups-algebras], keywords: [exponential map, normal coordinates, one-parameter subgroup]}
              - {id: geom.partition-of-unity, title: Partitions of unity, kind: theorem, level: advanced, scope: "Existence of smooth partitions of unity subordinate to an open cover, and their use to build global objects (metrics, integrals of forms) from local ones.", prereqs: [geom.smooth-manifolds, found.compactness], keywords: [partition of unity, subordinate, bump function]}
              - {id: geom.symplectic-manifolds, title: Symplectic manifolds and Hamiltonian vector fields, kind: definition, level: advanced, scope: "Symplectic form, canonical form on a cotangent bundle, Hamiltonian vector fields, Poisson brackets, Liouville's theorem on phase-space volume.", prereqs: [geom.differential-forms, var.canonical-equations], keywords: [symplectic, hamiltonian vector field, poisson bracket]}
              - {id: geom.killing-vectors, title: Killing vector fields and symmetries, kind: definition, level: advanced, scope: "Isometries of a metric, the Killing equation, conserved quantities along geodesics, examples on flat space and the sphere.", prereqs: [geom.riemannian-metrics, geom.flows-integral-curves], keywords: [killing vector, isometry, symmetry]}

  - id: dyn
    title: Dynamical systems
    chapters:
      - id: one-dimensional
        title: One-dimensional flows
        summary: Fixed points, stability and bifurcations on the line and the circle.
        sections:
          - id: flows-on-the-line
            title: Flows on the line and circle
            units:
              - {id: dyn.flows-on-the-line, title: Flows on the line, kind: method, scope: "Phase line, fixed points, linear stability analysis, impossibility of oscillation in one dimension.", prereqs: [ode.existence-uniqueness], keywords: [fixed points, linear stability, flows on the line]}
              - {id: dyn.one-dimensional-bifurcations, title: Bifurcations in one dimension, kind: theorem, scope: "Saddle-node, transcritical and pitchfork bifurcations, normal forms, imperfect bifurcations and hysteresis.", prereqs: [dyn.flows-on-the-line], keywords: [saddle-node, transcritical, pitchfork]}
              - {id: dyn.flows-on-the-circle, title: Flows on the circle, kind: method, scope: "Uniform and nonuniform oscillators, bottleneck period, phase locking.", prereqs: [dyn.flows-on-the-line], keywords: [nonuniform oscillator, flows on the circle, phase locking]}
      - id: planar
        title: Planar systems
        summary: Linear classification, nonlinear stability and oscillations in the plane.
        sections:
          - id: phase-plane
            title: The phase plane
            units:
              - {id: dyn.linear-planar-classification, title: Classification of linear planar systems, kind: theorem, scope: "Trace-determinant classification of fixed points: nodes, saddles, spirals, centres, degenerate cases.", prereqs: [ode.linear-systems], keywords: [classification, saddle, stable node]}
              - {id: dyn.linearization, title: Linearization and the Hartman-Grobman theorem, kind: theorem, scope: "Jacobian at a fixed point, hyperbolic fixed points, Hartman-Grobman (statement), when linearization fails.", prereqs: [dyn.linear-planar-classification], keywords: [linearization, hartman-grobman, hyperbolic]}
              - {id: dyn.lyapunov-functions, title: Lyapunov functions, kind: theorem, scope: "Lyapunov stability and asymptotic stability theorems, constructing Lyapunov functions, LaSalle (statement).", prereqs: [dyn.linearization], keywords: [liapunov function, lyapunov function, stability]}
              - {id: dyn.conservative-reversible, title: Conservative and reversible systems, kind: method, scope: "Energy as a conserved quantity, centres in conservative systems, reversibility, homoclinic orbits.", prereqs: [dyn.linearization], keywords: [conservative system, reversible, homoclinic]}
              - {id: dyn.index-theory, title: Index theory, kind: theorem, level: advanced, scope: "Index of a closed curve and of fixed points, consequences for closed orbits.", prereqs: [dyn.linear-planar-classification], keywords: [index theory, index of a fixed point]}
          - id: oscillations
            title: Limit cycles and oscillations
            units:
              - {id: dyn.poincare-bendixson, title: Limit cycles and the Poincare-Bendixson theorem, kind: theorem, scope: "Limit cycles, ruling out closed orbits (gradient systems, Dulac), Poincare-Bendixson theorem and trapping regions.", prereqs: [dyn.linearization], keywords: [poincare-bendixson, limit cycle, dulac]}
              - {id: dyn.hopf-bifurcation, title: The Hopf bifurcation, kind: theorem, scope: "Supercritical and subcritical Hopf bifurcations, statement, detecting them from eigenvalues.", prereqs: [dyn.poincare-bendixson, dyn.one-dimensional-bifurcations], keywords: [hopf bifurcation, supercritical, subcritical]}
              - {id: dyn.relaxation-averaging, title: Relaxation oscillations and averaging, kind: method, scope: "Van der Pol oscillator, relaxation limit, two-timing and averaging for weakly nonlinear oscillators.", prereqs: [dyn.poincare-bendixson, asym.regular-perturbation], keywords: [van der pol, relaxation oscillation, two-timing]}
              - {id: dyn.global-bifurcations, title: Global bifurcations of cycles, kind: definition, level: advanced, scope: "Saddle-node of cycles, infinite-period and homoclinic bifurcations, scaling of periods.", prereqs: [dyn.hopf-bifurcation], keywords: [global bifurcation, homoclinic bifurcation, infinite-period]}
      - id: chaos
        title: Chaos
        summary: Sensitive dependence, maps, strange attractors and fractals.
        sections:
          - id: chaos
            title: Chaotic dynamics
            units:
              - {id: dyn.lorenz-equations, title: The Lorenz equations, kind: application, scope: "Derivation context, symmetries, volume contraction, fixed points and their stability, the strange attractor.", prereqs: [dyn.lyapunov-functions], keywords: [lorenz equations, strange attractor]}
              - {id: dyn.lyapunov-exponents, title: Lyapunov exponents and sensitive dependence, kind: definition, scope: "Separation of nearby trajectories, Lyapunov exponents, predictability horizon.", prereqs: [dyn.lorenz-equations], keywords: [liapunov exponent, lyapunov exponent, sensitive dependence]}
              - {id: dyn.one-dimensional-maps, title: One-dimensional maps, kind: method, scope: "Fixed points and cycles of maps, cobweb diagrams, the logistic map.", prereqs: [dyn.flows-on-the-line], keywords: [logistic map, cobweb, one-dimensional maps]}
              - {id: dyn.period-doubling, title: Period doubling and universality, kind: theorem, scope: "Period-doubling cascade, Feigenbaum constants, universality (statement), intermittency.", prereqs: [dyn.one-dimensional-maps], keywords: [period-doubling, feigenbaum, universality]}
              - {id: dyn.poincare-maps, title: Poincare maps, kind: method, scope: "Poincare sections, stability of periodic orbits from the return map.", prereqs: [dyn.poincare-bendixson, dyn.one-dimensional-maps], keywords: [poincare map, poincare section, return map]}
              - {id: dyn.fractals, title: Fractals and dimension, kind: definition, scope: "Cantor set, self-similarity, box and similarity dimensions, fractal attractors.", prereqs: [dyn.one-dimensional-maps], keywords: [fractal, box dimension, cantor set]}
              - {id: dyn.henon-map, title: The Henon map and strange attractors, kind: example, level: advanced, scope: "Henon map, stretching and folding, structure of the attractor.", prereqs: [dyn.fractals], keywords: [henon map, stretching and folding]}

