              - {id: measure.measurable-functions, title: Measurable functions, kind: definition, scope: "Measurable functions, closure under limits, simple-function approximation.", prereqs: [measure.sigma-algebras-measures], keywords: [measurable function, simple function]}
              - {id: measure.lebesgue-integral, title: The Lebesgue integral, kind: definition, scope: "Integral of simple, non-negative and integrable functions; comparison with the Riemann integral.", prereqs: [measure.measurable-functions, measure.lebesgue-measure], keywords: [lebesgue integral, integrable function, riemann integral]}
          - id: convergence-theorems
            title: Convergence theorems
            units:
              - {id: measure.monotone-convergence-fatou, title: Monotone convergence and Fatou's lemma, kind: theorem, scope: "Monotone convergence theorem, Fatou's lemma, termwise integration of non-negative series.", prereqs: [measure.lebesgue-integral], keywords: [monotone convergence, fatou's lemma]}
              - {id: measure.dominated-convergence, title: Dominated convergence, kind: theorem, scope: "Dominated convergence theorem and its use for limits and differentiation under the integral.", prereqs: [measure.monotone-convergence-fatou], keywords: [dominated convergence]}
              - {id: measure.fubini-tonelli, title: Fubini and Tonelli theorems, kind: theorem, scope: "Product measures (outline), Tonelli for non-negative functions, Fubini for integrable functions, a counterexample.", prereqs: [measure.dominated-convergence], keywords: [fubini, tonelli, product measure]}
              - {id: measure.modes-of-convergence, title: Modes of convergence, kind: definition, scope: "Almost everywhere, in measure, in L^p; Egorov's theorem; relations and counterexamples.", prereqs: [measure.dominated-convergence], keywords: [convergence in measure, almost everywhere, egoroff]}
