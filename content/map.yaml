              - {id: measure.radon-nikodym, title: The Radon-Nikodym theorem, kind: theorem, level: advanced, scope: "Absolute continuity, the Radon-Nikodym derivative, densities in probability.", prereqs: [measure.lp-spaces], keywords: [radon-nikodym, absolutely continuous]}

  - id: funcan
    title: Hilbert spaces and operators
    chapters:
      - id: spaces
