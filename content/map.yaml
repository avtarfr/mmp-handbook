              - {id: funcan.adjoint-operators, title: "Adjoints, self-adjoint and unitary operators", kind: definition, scope: "Hilbert adjoint, self-adjoint, unitary and projection operators, their elementary properties.", prereqs: [funcan.bounded-operators, funcan.riesz-representation], keywords: [hilbert-adjoint, self-adjoint operator, unitary operator]}
