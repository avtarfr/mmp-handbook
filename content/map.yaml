              - {id: funcan.banach-fixed-point, title: The contraction mapping theorem, kind: theorem, scope: "Banach fixed point theorem with error bounds, applications to equations and ODEs.", prereqs: [funcan.metric-spaces], keywords: [banach fixed point, contraction, fixed point theorem]}
              - {id: funcan.normed-banach-spaces, title: Normed and Banach spaces, kind: definition, scope: "Norms, Banach spaces, examples (l^p, C[a,b]), equivalence of norms in finite dimensions.", prereqs: [funcan.metric-spaces, linalg.vector-spaces-bases], keywords: [normed space, banach space]}
              - {id: funcan.hilbert-spaces, title: Hilbert spaces, kind: definition, scope: "Inner product spaces, completeness, l^2 and L^2, parallelogram law.", prereqs: [funcan.normed-banach-spaces, linalg.inner-product-spaces], keywords: [hilbert space, inner product space, parallelogram]}
              - {id: funcan.projection-theorem, title: The projection theorem, kind: theorem, scope: "Closest point in a closed convex set, orthogonal complements, direct sum decomposition.", prereqs: [funcan.hilbert-spaces], keywords: [projection theorem, orthogonal complement]}
              - {id: funcan.orthonormal-bases, title: Orthonormal bases in Hilbert space, kind: theorem, scope: "Bessel's inequality, Parseval's identity, criteria for completeness, separable spaces.", prereqs: [funcan.projection-theorem], keywords: [orthonormal basis, total orthonormal, parseval]}
              - {id: funcan.riesz-representation, title: The Riesz representation theorem, kind: theorem, scope: "Bounded linear functionals on a Hilbert space are inner products; bra-ket interpretation.", prereqs: [funcan.projection-theorem], keywords: [riesz representation, linear functional]}
              - {id: funcan.weak-convergence, title: Weak convergence, kind: definition, level: advanced, scope: "Weak and strong convergence, examples in l^2, boundedness of weakly convergent sequences.", prereqs: [funcan.riesz-representation], keywords: [weak convergence, strong convergence]}
      - id: operators
