              - {id: geom.metric-tensor, title: The metric tensor, kind: definition, scope: "Line element, raising and lowering indices, the metric in curvilinear coordinates.", prereqs: [geom.tensors], keywords: [metric tensor, line element, raising and lowering]}
              - {id: geom.covariant-derivative, title: Christoffel symbols and the covariant derivative, kind: definition, scope: "Christoffel symbols from the metric, covariant derivative of tensors, parallel transport.", prereqs: [geom.metric-tensor], keywords: [christoffel symbols, covariant derivative, parallel transport]}
              - {id: geom.tensor-operators-general-coordinates, title: Differential operators in general coordinates, kind: method, scope: "Divergence, Laplacian and curl in general coordinates via the metric determinant.", prereqs: [geom.covariant-derivative, vcalc.curvilinear-coordinates], keywords: [laplacian, general coordinates, divergence]}
              - {id: geom.pseudotensors, title: Pseudotensors and the Levi-Civita tensor, kind: definition, scope: "Behaviour under reflections, axial vectors, the Levi-Civita tensor density.", prereqs: [geom.tensors], keywords: [pseudotensor, axial vector, levi-civita]}
              - {id: geom.stress-strain, title: Stress and strain tensors, kind: application, scope: "Strain tensor, stress tensor, Hooke's law for isotropic media, principal axes.", prereqs: [geom.tensors, linalg.hermitian-spectral-theorem], keywords: [stress tensor, strain tensor, elasticity]}
