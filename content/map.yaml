              - {id: prob.convergence-random-variables, title: Convergence of random variables, kind: definition, scope: "Almost sure, in probability, in mean, in distribution; implications; Borel-Cantelli lemmas.", prereqs: [prob.probability-inequalities], keywords: [convergence in probability, almost surely, borel-cantelli]}
