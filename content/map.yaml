              - {id: geom.first-fundamental-form, title: Regular surfaces and the first fundamental form, kind: definition, scope: "Regular surfaces, tangent planes, first fundamental form, lengths, angles and areas.", prereqs: [vcalc.surface-integrals], keywords: [first fundamental form, regular surface, tangent plane]}
              - {id: geom.surface-curvature, title: The second fundamental form and curvature, kind: definition, scope: "Gauss map, second fundamental form, principal, Gaussian and mean curvature.", prereqs: [geom.first-fundamental-form], keywords: [gaussian curvature, second fundamental form, mean curvature]}
              - {id: geom.theorema-egregium, title: Gauss's Theorema Egregium, kind: theorem, scope: "Gaussian curvature depends only on the first fundamental form; consequences for maps.", prereqs: [geom.surface-curvature, geom.covariant-derivative], keywords: [theorema egregium, gauss formula]}
              - {id: geom.geodesics, title: Geodesics, kind: method, scope: "Geodesic equation from the metric, geodesics as extremals of length, examples on the sphere.", prereqs: [geom.covariant-derivative, var.euler-lagrange-equation], keywords: [geodesic, geodesic equation]}
              - {id: geom.gauss-bonnet, title: The Gauss-Bonnet theorem, kind: theorem, level: advanced, scope: "Local and global Gauss-Bonnet, Euler characteristic.", prereqs: [geom.theorema-egregium, geom.geodesics], keywords: [gauss-bonnet, euler characteristic]}
          - id: manifolds
            title: Smooth manifolds
            units:
