              - {id: prob.characteristic-functions, title: Characteristic functions, kind: theorem, scope: "Definition, properties, inversion and continuity theorems (statements), moments.", prereqs: [prob.expectation-variance, fourier.fourier-inversion], keywords: [characteristic function, inversion theorem, continuity theorem]}
      - id: limit-theorems
